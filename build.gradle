plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'retrocraft' }

repositories {
    mavenCentral()
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    runs {
        client {
            if (project.hasProperty('retrocraftRunDir')) runDir project.property('retrocraftRunDir')
        }
    }
}

configurations { workerLibraries }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly 'net.java.dev.jna:jna:5.15.0'
    workerLibraries 'net.java.dev.jna:jna:5.15.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('workerJar', Jar) {
    archiveFileName = 'retrocraft-worker.jar'
    destinationDirectory = layout.buildDirectory.dir('worker')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.sammwy.retrocraft.cores.worker.WorkerMain' }
    dependsOn compileJava
    from(layout.buildDirectory.dir('classes/java/main')) {
        include 'com/sammwy/retrocraft/cores/worker/**'
        include 'com/sammwy/retrocraft/cores/stream/**'
    }
    from { configurations.workerLibraries.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(tasks.named('workerJar')) { into 'retrocraft' }
}

jar {
    from('LICENSE') { rename { 'LICENSE_retrocraft' } }
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
test {
    useJUnitPlatform()
    dependsOn tasks.named('workerJar')
    systemProperty 'retrocraft.workerJar', tasks.named('workerJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'retrocraft.testDownload', System.getenv('RETROCRAFT_TEST_DOWNLOAD') ?: 'false'
    if (System.getenv('RETROCRAFT_TEST_CORE')) systemProperty 'retrocraft.testCore', System.getenv('RETROCRAFT_TEST_CORE')
}
