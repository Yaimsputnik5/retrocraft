name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod JAR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew remapJar -Pmod_version="$VERSION" --no-daemon
          echo "JAR_PATH=build/libs/retrocraft-${VERSION}.jar" >> "$GITHUB_ENV"

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR_PATH }}
          generate_release_notes: true
